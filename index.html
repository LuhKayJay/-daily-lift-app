<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Lift V3</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b10;
  color: white;
}

/* TOP AREA */
header {
  text-align: center;
  padding: 15px;
  background: #141420;
  font-weight: bold;
}

/* SCREEN */
.screen {
  display: none;
  padding: 15px;
}

.active {
  display: block;
}

/* CARD STYLE */
.card {
  background: #1a1a24;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 12px;
}

/* BOTTOM NAV */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #141420;
}

.nav button {
  flex: 1;
  padding: 12px;
  border: none;
  background: none;
  color: white;
}

/* ITEMS */
.item {
  background: #222;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
}

img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  border-radius: 10px;
  margin-top: 8px;
}
</style>
</head>

<body>

<header>🔥 Daily Lift V3</header>

<!-- SCREENS -->
<div id="home" class="screen active">
  <div class="card">
    🌅 Morning Lift
  </div>

  <div class="card">
    🌙 Night Lift
  </div>
</div>

<div id="products" class="screen">
  <div class="card">🧴 Products</div>
</div>

<div id="ai" class="screen">
  <div class="card">🧠 AI Assistant (coming next)</div>
</div>

<div id="stats" class="screen">
  <div class="card">📊 Streaks (coming next)</div>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('products')">Products</button>
  <button onclick="show('ai')">AI</button>
  <button onclick="show('stats')">Stats</button>
</div>

<script>
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>

</body>
</html>
