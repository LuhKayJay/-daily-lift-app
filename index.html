<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Lift V4.1</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:radial-gradient(circle at top,#1a1a2e,#0b0b10);
  color:white;
}

.app{
  max-width:420px;
  margin:auto;
  padding:12px;
}

header{
  text-align:center;
  font-weight:600;
  margin-bottom:8px;
}

.date{
  text-align:center;
  font-size:13px;
  opacity:0.7;
  margin-bottom:10px;
}

/* CALENDAR */
.calendar{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin-bottom:10px;
}

.day{
  flex:1;
  text-align:center;
  padding:6px;
  border-radius:8px;
  opacity:0.6;
  cursor:pointer;
}

.activeDay{
  background:rgba(108,92,231,0.3);
  opacity:1;
}

/* PROGRESS */
.bar{
  height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:20px;
  overflow:hidden;
  margin-top:5px;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#6c5ce7,#00d2ff);
}

/* ITEMS */
.section{
  margin:12px 0;
}

.item{
  padding:8px 0;
  font-size:14px;
  cursor:pointer;
  opacity:0.9;
}

.done{
  text-decoration:line-through;
  opacity:0.3;
}

.pct{
  font-size:12px;
  opacity:0.7;
}
</style>
</head>

<body>

<div class="app">

<header>🔥 Daily Lift V4.1 (Locked Routine)</header>
<div class="date" id="date"></div>

<!-- CALENDAR -->
<div class="calendar" id="calendar"></div>

<!-- MORNING -->
<div class="section">
  <div>🌅 Morning <span class="pct" id="mPct">0%</span></div>
  <div class="bar"><div id="mBar" class="fill"></div></div>

  <div id="morningList"></div>
</div>

<!-- NIGHT -->
<div class="section">
  <div>🌙 Night — <span id="nightType">Loading...</span> <span class="pct" id="nPct">0%</span></div>
  <div class="bar"><div id="nBar" class="fill"></div></div>

  <div id="nightList"></div>
</div>

<!-- DAILY -->
<div class="section">
  <div>📊 Today <span class="pct" id="dPct">0%</span></div>
  <div class="bar"><div id="dBar" class="fill"></div></div>
</div>

</div>

<script>

let days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
let selected=new Date().getDay();

/* 🔒 LOCKED WEEKLY ROUTINE */
const schedule = {
  0:{type:"Recovery",night:["Cleanser","Moisturizer"]},
  1:{type:"Acne",night:["Cleanser","Salicylic Acid 2%","Moisturizer"]},
  2:{type:"Recovery",night:["Cleanser","Moisturizer"]},
  3:{type:"Retinol",night:["Cleanser","Retinol","Moisturizer"]},
  4:{type:"Recovery",night:["Cleanser","Moisturizer"]},
  5:{type:"Mask",night:["Cleanser","Mask","Moisturizer"]},
  6:{type:"Acne",night:["Cleanser","Salicylic Acid 2%","Moisturizer"]}
};

/* MORNING IS ALWAYS FIXED */
const morning=[
  "Cleanser - The Ordinary",
  "Glow Serum - Beauty of Joseon",
  "Moisturizer - Hydro Boost",
  "Sunscreen - Black Girl SPF"
];

/* STATE PER DAY */
let state={};
for(let i=0;i<7;i++){
  state[i]={m:[],n:[]};
}

/* INIT MORNING TEMPLATE */
function initDay(i){
  if(state[i].m.length===0){
    state[i.m]=morning.map(()=>false);
  }
  if(state[i].n.length===0){
    state[i].n=schedule[i].night.map(()=>false);
  }
}

function buildCalendar(){
  let c=document.getElementById("calendar");
  c.innerHTML="";

  days.forEach((d,i)=>{
    let el=document.createElement("div");
    el.className="day"+(i===selected?" activeDay":"");
    el.innerText=d.slice(0,3);
    el.onclick=()=>{
      selected=i;
      render();
    };
    c.appendChild(el);
  });
}

/* BUILD LISTS */
function buildLists(){

  initDay(selected);

  let mDiv=document.getElementById("morningList");
  let nDiv=document.getElementById("nightList");

  mDiv.innerHTML="";
  nDiv.innerHTML="";

  morning.forEach((item,i)=>{
    let el=document.createElement("div");
    el.className="item"+(state[selected].m[i]?" done":"");
    el.innerText=item;
    el.onclick=()=>{
      state[selected].m[i]=!state[selected].m[i];
      render();
    };
    mDiv.appendChild(el);
  });

  schedule[selected].night.forEach((item,i)=>{
    let el=document.createElement("div");
    el.className="item"+(state[selected].n[i]?" done":"");
    el.innerText=item;
    el.onclick=()=>{
      state[selected].n[i]=!state[selected].n[i];
      render();
    };
    nDiv.appendChild(el);
  });

  document.getElementById("nightType").innerText=
    schedule[selected].type;
}

/* UPDATE PROGRESS */
function update(){

  let mDone=state[selected].m.filter(Boolean).length;
  let nDone=state[selected].n.filter(Boolean).length;

  let mPct=(mDone/morning.length)*100;
  let nPct=(nDone/schedule[selected].night.length)*100;
  let dPct=(mPct+nPct)/2;

  document.getElementById("mBar").style.width=mPct+"%";
  document.getElementById("nBar").style.width=nPct+"%";
  document.getElementById("dBar").style.width=dPct+"%";

  document.getElementById("mPct").innerText=Math.round(mPct)+"%";
  document.getElementById("nPct").innerText=Math.round(nPct)+"%";
  document.getElementById("dPct").innerText=Math.round(dPct)+"%";
}

/* MAIN RENDER */
function render(){
  buildCalendar();
  buildLists();
  update();
}

document.getElementById("date").innerText=
new Date().toDateString();

render();

</script>

</body>
</html>
