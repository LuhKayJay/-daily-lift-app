<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Lift V3.8</title>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: radial-gradient(circle at top, #1a1a2e, #0b0b10);
  color: white;
}

.app {
  max-width: 420px;
  margin: auto;
  padding: 12px;
}

header {
  text-align: center;
  font-weight: 600;
  margin-bottom: 8px;
}

/* CALENDAR */
.calendar {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  opacity: 0.8;
  margin-bottom: 10px;
}

.day {
  flex: 1;
  text-align: center;
  padding: 6px;
  border-radius: 8px;
  cursor: pointer;
}

.activeDay {
  background: rgba(108,92,231,0.3);
  color: white;
}

/* SECTION */
.section {
  margin: 10px 0;
}

.item {
  padding: 8px 0;
  font-size: 14px;
  opacity: 0.9;
}

.done {
  text-decoration: line-through;
  opacity: 0.4;
}

/* PROGRESS */
.bar {
  height: 5px;
  background: rgba(255,255,255,0.1);
  border-radius: 20px;
  overflow: hidden;
}

.fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg,#6c5ce7,#00d2ff);
}

/* NAV */
.bottom {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  width: 95%;
  max-width: 420px;
  display: flex;
  justify-content: space-around;
  background: rgba(20,20,30,0.7);
  padding: 8px;
  border-radius: 16px;
}

button {
  background: none;
  border: none;
  color: #aaa;
  font-size: 11px;
}

button.activeTab {
  color: white;
}
</style>
</head>

<body>

<div class="app">

<header>🔥 Daily Lift V3.8</header>

<div id="topInfo"></div>

<!-- WEEK CALENDAR -->
<div class="calendar" id="calendar"></div>

<!-- PROGRESS -->
<div class="section">
  <div>📊 Today Progress</div>
  <div class="bar"><div id="todayBar" class="fill"></div></div>
</div>

<div class="section">
  <div>📈 Week Progress</div>
  <div class="bar"><div id="weekBar" class="fill"></div></div>
</div>

<!-- DAY VIEW -->
<div class="section">
  <h4 id="dayTitle"></h4>

  <div class="section">
    <div>🌅 Morning</div>
    <div class="item" onclick="toggle(this)">Cleanser</div>
    <div class="item" onclick="toggle(this)">Glow Serum</div>
    <div class="item" onclick="toggle(this)">Sunscreen</div>
  </div>

  <div class="section">
    <div>🌙 Night</div>
    <div class="item" onclick="toggle(this)">Cleanser</div>
    <div class="item" onclick="toggle(this)">Moisturizer</div>
    <div class="item" onclick="toggle(this)">Retinol</div>
  </div>
</div>

</div>

<div class="bottom">
  <button class="activeTab">🏠 Home</button>
  <button>🧴 Products</button>
  <button>📊 Stats</button>
  <button>🧠 AI</button>
</div>

<script>

let days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let selectedDay = new Date().getDay();

let m = 0;
let n = 0;

function buildCalendar(){
  let cal = document.getElementById("calendar");
  cal.innerHTML = "";

  days.forEach((d,i)=>{
    let div = document.createElement("div");
    div.className = "day" + (i===selectedDay ? " activeDay" : "");
    div.innerText = d;
    div.onclick = ()=>selectDay(i);
    cal.appendChild(div);
  });
}

function selectDay(i){
  selectedDay = i;
  buildCalendar();
  document.getElementById("dayTitle").innerText = "Selected: " + days[i];
}

function toggle(el){
  el.classList.toggle("done");
  update();
}

function update(){
  let todayPct = Math.min((m+n)/6*100,100);
  let weekPct = todayPct; // simplified for now

  document.getElementById("todayBar").style.width = todayPct + "%";
  document.getElementById("weekBar").style.width = weekPct + "%";
}

buildCalendar();
selectDay(selectedDay);

</script>

</body>
</html>
