<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Lift V3 Stable</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0b10;
  color: white;
}

header {
  text-align: center;
  padding: 15px;
  background: #141420;
  font-weight: bold;
}

.screen {
  display: none;
  padding: 15px;
  padding-bottom: 80px;
}

.active {
  display: block;
}

.card {
  background: #1a1a24;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 12px;
}

.item {
  background: #222;
  padding: 10px;
  margin-top: 8px;
  border-radius: 8px;
  cursor: pointer;
}

.done {
  opacity: 0.5;
  text-decoration: line-through;
}

/* NAV */
.nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  display: flex;
  background: #141420;
}

.nav button {
  flex: 1;
  padding: 12px;
  border: none;
  background: none;
  color: white;
}
</style>
</head>

<body>

<header>🔥 Daily Lift V3 Stable</header>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="card">
    <h2>🌅 Morning Lift</h2>
    <div class="item" onclick="toggle(this)">Cleanser</div>
    <div class="item" onclick="toggle(this)">Glow Serum</div>
    <div class="item" onclick="toggle(this)">Sunscreen</div>
  </div>

  <div class="card">
    <h2>🌙 Night Lift</h2>
    <div class="item" onclick="toggle(this)">Cleanser</div>
    <div class="item" onclick="toggle(this)">Moisturizer</div>
  </div>
</div>

<!-- PRODUCTS -->
<div id="products" class="screen">
  <div class="card">
    <h2>🧴 Products</h2>
    <p>Stable version ready ✔️ (we will re-add images next)</p>
  </div>
</div>

<!-- STATS -->
<div id="stats" class="screen">
  <div class="card">
    <h2>📊 Stats</h2>
    <p>Coming next</p>
  </div>
</div>

<!-- AI -->
<div id="ai" class="screen">
  <div class="card">
    <h2>🧠 AI</h2>
    <p>Coming next</p>
  </div>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="showTab('home')">Home</button>
  <button onclick="showTab('products')">Products</button>
  <button onclick="showTab('stats')">Stats</button>
  <button onclick="showTab('ai')">AI</button>
</div>

<script>
function showTab(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  const el = document.getElementById(id);
  if (el) el.classList.add("active");
}

function toggle(el){
  el.classList.toggle("done");
}
</script>

</body>
</html>
