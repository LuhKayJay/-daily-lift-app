<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skincare Tracker Stable Fix</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#0b0b10;
  color:white;
}

/* FIX LAYOUT STACKING */
.app{
  max-width:420px;
  margin:auto;
  padding:12px;
  padding-bottom:90px;
  position:relative;
  z-index:1;
}

.date{
  text-align:center;
  opacity:0.7;
  margin:10px 0;
}

/* TABS ALWAYS ON TOP OF CONTENT */
.tabs{
  display:flex;
  position:sticky;
  top:0;
  background:#0b0b10;
  z-index:10;
  padding-bottom:6px;
}

.tab{
  flex:1;
  text-align:center;
  padding:6px;
  font-size:12px;
  opacity:0.6;
  cursor:pointer;
}

.tab.active{
  opacity:1;
  border-bottom:2px solid #6c5ce7;
}

/* CALENDAR FIXED (NO OVERLAP EVER) */
.calendar{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin:12px 0;
  position:relative;
  z-index:1;
}

.day{
  flex:1;
  text-align:center;
  padding:6px;
  opacity:0.6;
  cursor:pointer;
}

.day.active{
  background:#222;
  border-radius:8px;
  opacity:1;
}

/* CONTENT */
.page{display:none;}
.page.active{display:block;}

.item{padding:6px 0;cursor:pointer;}
.done{text-decoration:line-through;opacity:0.3;}

/* BARS */
.bar{
  height:6px;
  background:#222;
  border-radius:20px;
  overflow:hidden;
}
.fill{
  height:100%;
  width:0%;
  background:#6c5ce7;
}

/* STATS */
.stats{font-size:13px;opacity:0.85;}

button{
  margin:4px;
  padding:6px;
  font-size:11px;
}
</style>
</head>

<body>

<div class="app">

<div class="date" id="date"></div>

<div class="tabs">
  <div class="tab active" onclick="openTab('home',this)">Home</div>
  <div class="tab" onclick="openTab('products',this)">Products</div>
  <div class="tab" onclick="openTab('stats',this)">Stats</div>
</div>

<div class="calendar" id="calendar"></div>

<!-- HOME -->
<div id="home" class="page active">

🌅 Morning <span id="mPct">0%</span>
<div class="bar"><div id="mBar" class="fill"></div></div>
<div id="morning"></div>

<br>

🌙 Night <span id="nPct">0%</span>
<div class="bar"><div id="nBar" class="fill"></div></div>
<div id="night"></div>

</div>

<!-- PRODUCTS -->
<div id="products" class="page">
<h3>Products</h3>
<div>The Ordinary Cleanser</div>
<div>Beauty of Joseon Glow Serum</div>
<div>Neutrogena Hydro Boost</div>
<div>Black Girl Sunscreen</div>
<div>Salicylic Acid</div>
<div>Retinol</div>
<div>Mugwort Clay Stick</div>
</div>

<!-- STATS -->
<div id="stats" class="page">
<h3>Stats</h3>

🌅 Morning Days: <span id="mCount">0</span><br>
🌙 Night Days: <span id="nCount">0</span><br>
📅 Full Days: <span id="fCount">0</span><br>
🔥 Streak: <span id="streak">0</span><br>

<hr>

<button onclick="reset('m')">Reset Morning</button>
<button onclick="reset('n')">Reset Night</button>
<button onclick="reset('all')">Reset All</button>

</div>

</div>

<script>

/* DATE */
document.getElementById("date").innerText=new Date().toDateString();

/* DAYS */
let days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let selected=new Date().getDay();

/* ROUTINES */
const schedule={
0:["Cleanser","Moisturizer"],
1:["Cleanser","Salicylic Acid","Moisturizer"],
2:["Cleanser","Moisturizer"],
3:["Cleanser","Retinol","Moisturizer"],
4:["Cleanser","Moisturizer"],
5:["Cleanser","Mask","Moisturizer"],
6:["Cleanser","Salicylic Acid","Moisturizer"]
};

const morning=["Cleanser","Glow Serum","Moisturizer","Sunscreen"];

/* STATE */
let state={};
for(let i=0;i<7;i++) state[i]={m:[],n:[],done:false};

/* STREAK (ONLY CHANGES ON COMPLETION) */
let streakData={current:0,best:0};

/* TAB */
function openTab(id,el){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");

document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
el.classList.add("active");
}

/* CALENDAR (NO LOGIC) */
function buildCalendar(){
let c=document.getElementById("calendar");
c.innerHTML="";

days.forEach((d,i)=>{
let div=document.createElement("div");
div.className="day"+(i===selected?" active":"");
div.innerText=d;
div.onclick=()=>{selected=i;render();};
c.appendChild(div);
});
}

/* TOGGLE = ONLY PLACE WHERE STREAK CAN CHANGE */
function toggle(type,i){

state[selected][type][i]=!state[selected][type][i];

/* CHECK IF FULL DAY COMPLETE */
let fullDone =
state[selected].m.every(v=>v) &&
state[selected].n.every(v=>v);

/* ONLY UPDATE STREAK HERE (NOT ANYWHERE ELSE) */
if(fullDone && !state[selected].done){
state[selected].done=true;
streakData.current++;
streakData.best=Math.max(streakData.best,streakData.current);
}

if(!fullDone && state[selected].done){
state[selected].done=false;
streakData.current=Math.max(0,streakData.current-1);
}

render();
}

/* BUILD UI */
function build(){

let s=state[selected];

document.getElementById("morning").innerHTML=
morning.map((x,i)=>
`<div class="item ${s.m[i]?'done':''}" onclick="toggle('m',${i})">${x}</div>`
).join("");

let night=schedule[selected];

document.getElementById("night").innerHTML=
night.map((x,i)=>
`<div class="item ${s.n[i]?'done':''}" onclick="toggle('n',${i})">${x}</div>`
).join("");
}

/* UPDATE STATS */
function update(){

let stats={m:0,n:0,f:0};

for(let i=0;i<7;i++){
let mDone=state[i].m.every(v=>v);
let nDone=state[i].n.every(v=>v);

if(mDone) stats.m++;
if(nDone) stats.n++;
if(mDone&&nDone) stats.f++;
}

let s=state[selected];

let mPct=(s.m.filter(Boolean).length/morning.length)*100;
let nPct=(s.n.filter(Boolean).length/schedule[selected].length)*100;

document.getElementById("mBar").style.width=mPct+"%";
document.getElementById("nBar").style.width=nPct+"%";

document.getElementById("mPct").innerText=Math.round(mPct)+"%";
document.getElementById("nPct").innerText=Math.round(nPct)+"%";

document.getElementById("mCount").innerText=stats.m;
document.getElementById("nCount").innerText=stats.n;
document.getElementById("fCount").innerText=stats.f;

document.getElementById("streak").innerText=streakData.current;
}

/* RESET */
function reset(type){

if(type==="m"){
for(let i=0;i<7;i++) state[i].m=[];
}

if(type==="n"){
for(let i=0;i<7;i++) state[i].n=[];
}

if(type==="all"){
for(let i=0;i<7;i++) state[i]={m:[],n:[],done:false};
streakData={current:0,best:0};
}

render();
}

/* RENDER */
function render(){
buildCalendar();
build();
update();
}

render();

</script>

</body>
</html>
