<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Lift V5 - Streak System</title>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:radial-gradient(circle at top,#1a1a2e,#0b0b10);
  color:white;
}

.app{
  max-width:420px;
  margin:auto;
  padding:12px;
  padding-bottom:80px;
}

header{
  text-align:center;
  font-weight:600;
}

.date{
  text-align:center;
  font-size:13px;
  opacity:0.7;
  margin:6px 0 10px;
}

/* TABS */
.tabs{
  display:flex;
  margin-bottom:10px;
}

.tab{
  flex:1;
  text-align:center;
  font-size:12px;
  padding:6px;
  opacity:0.6;
  cursor:pointer;
}

.tab.active{
  opacity:1;
  border-bottom:2px solid #6c5ce7;
}

/* CALENDAR */
.calendar{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  margin:10px 0;
}

.day{
  flex:1;
  text-align:center;
  padding:6px;
  opacity:0.6;
  cursor:pointer;
}

.day.active{
  background:rgba(108,92,231,0.3);
  border-radius:8px;
  opacity:1;
}

/* ITEMS */
.item{
  padding:7px 0;
  font-size:14px;
  cursor:pointer;
  opacity:0.9;
}

.done{
  text-decoration:line-through;
  opacity:0.3;
}

/* PROGRESS */
.bar{
  height:6px;
  background:rgba(255,255,255,0.1);
  border-radius:20px;
  overflow:hidden;
  margin-top:4px;
}

.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#6c5ce7,#00d2ff);
}

/* STATS */
.stats{
  margin-top:10px;
  font-size:13px;
  opacity:0.85;
}
</style>
</head>

<body>

<div class="app">

<header>🔥 Daily Lift V5</header>
<div class="date" id="date"></div>

<!-- CALENDAR -->
<div class="calendar" id="calendar"></div>

<!-- MORNING -->
<div class="section">
  <div>🌅 Morning <span id="mPct">0%</span></div>
  <div class="bar"><div id="mBar" class="fill"></div></div>

  <div id="morningList"></div>
</div>

<!-- NIGHT -->
<div class="section">
  <div>🌙 Night — <span id="nightType"></span> <span id="nPct">0%</span></div>
  <div class="bar"><div id="nBar" class="fill"></div></div>

  <div id="nightList"></div>
</div>

<!-- TODAY -->
<div class="section">
  <div>📊 Today <span id="dPct">0%</span></div>
  <div class="bar"><div id="dBar" class="fill"></div></div>
</div>

<!-- STREAK -->
<div class="stats">
🔥 Current Streak: <span id="streak">0</span><br>
🏆 Best Streak: <span id="best">0</span><br>
📅 Total Days Completed: <span id="total">0</span>
</div>

</div>

<script>

/* DATE */
document.getElementById("date").innerText =
new Date().toDateString();

/* DAYS */
let days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
let selected=new Date().getDay();

/* ROUTINE */
const schedule={
  0:{type:"Recovery",night:["Cleanser","Moisturizer"]},
  1:{type:"Acne",night:["Cleanser","Salicylic Acid","Moisturizer"]},
  2:{type:"Recovery",night:["Cleanser","Moisturizer"]},
  3:{type:"Retinol",night:["Cleanser","Retinol","Moisturizer"]},
  4:{type:"Recovery",night:["Cleanser","Moisturizer"]},
  5:{type:"Mask",night:["Cleanser","Mask","Moisturizer"]},
  6:{type:"Acne",night:["Cleanser","Salicylic Acid","Moisturizer"]}
};

/* MORNING */
const morning=[
  "Cleanser - The Ordinary",
  "Glow Serum - Beauty of Joseon",
  "Moisturizer - Neutrogena Hydro Boost",
  "Sunscreen - Black Girl SPF"
];

/* STATE */
let state={};
for(let i=0;i<7;i++){
  state[i]={m:[],n:[]};
}

/* STREAK SYSTEM */
let streakData={
  current:0,
  best:0,
  total:0,
  lastCompletedDay:-1
};

/* CALENDAR */
function buildCalendar(){
  let c=document.getElementById("calendar");
  c.innerHTML="";

  days.forEach((d,i)=>{
    let el=document.createElement("div");
    el.className="day"+(i===selected?" active":"");
    el.innerText=d;
    el.onclick=()=>{
      selected=i;
      render();
    };
    c.appendChild(el);
  });
}

/* TOGGLE */
function toggle(type,i){
  state[selected][type][i]=!state[selected][type][i];
  render();
}

/* BUILD UI */
function build(){

  let s=state[selected];

  document.getElementById("morningList").innerHTML=
  morning.map((x,i)=>
    `<div class="item ${s.m[i]?'done':''}" onclick="toggle('m',${i})">${x}</div>`
  ).join("");

  let night=schedule[selected].night;

  document.getElementById("nightType").innerText=
  schedule[selected].type;

  document.getElementById("nightList").innerHTML=
  night.map((x,i)=>
    `<div class="item ${s.n[i]?'done':''}" onclick="toggle('n',${i})">${x}</div>`
  ).join("");
}

/* STREAK CHECK */
function checkStreak(){

  let s=state[selected];

  let mDone=s.m.filter(Boolean).length===morning.length;
  let nDone=s.n.filter(Boolean).length===schedule[selected].night.length;

  let fullDay=mDone && nDone;

  if(fullDay && streakData.lastCompletedDay!==selected){

    streakData.current++;
    streakData.total++;

    if(streakData.current>streakData.best){
      streakData.best=streakData.current;
    }

    streakData.lastCompletedDay=selected;
  }

  if(!fullDay && streakData.lastCompletedDay!==selected){
    streakData.current=0;
  }
}

/* UPDATE UI */
function update(){

  let s=state[selected];

  let mPct=(s.m.filter(Boolean).length/morning.length)*100;
  let nPct=(s.n.filter(Boolean).length/schedule[selected].night.length)*100;
  let dPct=(mPct+nPct)/2;

  document.getElementById("mBar").style.width=mPct+"%";
  document.getElementById("nBar").style.width=nPct+"%";
  document.getElementById("dBar").style.width=dPct+"%";

  document.getElementById("mPct").innerText=Math.round(mPct)+"%";
  document.getElementById("nPct").innerText=Math.round(nPct)+"%";
  document.getElementById("dPct").innerText=Math.round(dPct)+"%";

  document.getElementById("streak").innerText=streakData.current;
  document.getElementById("best").innerText=streakData.best;
  document.getElementById("total").innerText=streakData.total;
}

/* MAIN */
function render(){
  buildCalendar();
  build();
  update();
  checkStreak();
}

render();

</script>

</body>
</html>
